services:
  main_services:
    container_name: ${STACK_NAME}-main-services
    build:
      context: ./main-services
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./main-services/src
    ports:
      - '${MAIN_SERVICES_PORT:-3000}:3000'
    restart: unless-stopped
    # Shows healthy/unhealthy in Portainer; 503 means the service is up but
    # MongoDB isn't answering.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      TZ: Pacific/Auckland
      LANG: en_NZ.UTF-8
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      MAIN_SERVICES_URL: ${MAIN_SERVICES_URL}
      SCRAPE_SERVICE_URL: ${SCRAPE_SERVICE_URL}
      SCRAPE_SEVERE_WEATHER_OUTLOOK_URL: ${SCRAPE_SEVERE_WEATHER_OUTLOOK_URL}
      SCRAPE_THUNDERSTORM_OUTLOOK_URL: ${SCRAPE_THUNDERSTORM_OUTLOOK_URL}
      METSERVICE_CAP_URL: ${METSERVICE_CAP_URL}
      ABLY_CHANNEL_NAME: ${ABLY_CHANNEL_NAME}
      ABLY_API_KEY: ${ABLY_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      # Feedback button: reports are always saved; these control notifications
      # and the admin view. Both are optional and set per stack in Portainer.
      APP_ENV: ${STACK_NAME:-}
      FEEDBACK_DISCORD_WEBHOOK_URL: ${FEEDBACK_DISCORD_WEBHOOK_URL:-}
      FEEDBACK_ADMIN_KEY: ${FEEDBACK_ADMIN_KEY:-}
    networks:
      - app-network
  scrape_services:
    container_name: ${STACK_NAME}-scrape-services
    build:
      context: ./scrape-services
      dockerfile: Dockerfile
    ports:
      - '${SCRAPE_SERVICES_PORT:-4000}:4000'
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland
    networks:
      - app-network
  ui:
    container_name: ${STACK_NAME}-ui
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_SHOW_DEV_BANNER: ${SHOW_DEV_BANNER:-false}
        # Umami analytics. The script only loads when UMAMI_WEBSITE_ID is set for
        # the stack (use a different website ID for dev and master). These are
        # baked in at build time, so changing them needs a rebuild/redeploy.
        VITE_UMAMI_SRC: ${UMAMI_SRC:-https://webwatch.bartletts.co.nz/script.js}
        VITE_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_DOMAINS: ${UMAMI_DOMAINS:-}
    depends_on:
      - main_services
      - scrape_services
      - mongodb
    ports:
      - '${UI_PORT:-3001}:3001'
    restart: unless-stopped
    # /api/health also checks the UI can reach main-services and the database.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      TZ: Pacific/Auckland
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      MAIN_SERVICES_URL: ${MAIN_SERVICES_URL}
      SCRAPE_SERVICE_URL: ${SCRAPE_SERVICE_URL}
      SCRAPE_SEVERE_WEATHER_OUTLOOK_URL: ${SCRAPE_SEVERE_WEATHER_OUTLOOK_URL}
      SCRAPE_THUNDERSTORM_OUTLOOK_URL: ${SCRAPE_THUNDERSTORM_OUTLOOK_URL}
      METSERVICE_CAP_URL: ${METSERVICE_CAP_URL}
      ABLY_CHANNEL_NAME: ${ABLY_CHANNEL_NAME}
      ABLY_API_KEY: ${ABLY_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
    networks:
      - app-network
  mongodb:
    image: mongo:latest
    container_name: ${STACK_NAME}-mongodb
    command:
      - --quiet
      - --logpath
      - /data/db/mongod.log
      - --logappend
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      TZ: Pacific/Auckland
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
volumes:
  mongodb_data: